name: Release ArcaLink Sync
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - name: Verify tag matches manifest
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'if (process.env.RELEASE_TAG !== require("./manifest.json").version) process.exit(1)'
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Existing release preserved; inspect its assets before replacing them."
          else
            gh release create "$RELEASE_TAG" --title "ArcaLink Sync $RELEASE_TAG" --draft --generate-notes main.js manifest.json styles.css
          fi
